name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # web/hw は hw/ の Verilog CPU を Icarus Verilog で動かして波形 (traces/*.json) を作る
      - name: Install Icarus Verilog (web/hw)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog

      - name: Build web/
        run: ./web/build.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
