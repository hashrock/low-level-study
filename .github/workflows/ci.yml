name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # emu のテストは os/zig-out/bin/kernel.elf があれば zigos の起動まで試す
      - name: Build zigos
        run: cd os && zig build

      - name: Go vet & test
        run: |
          set -e
          for d in db lang runtime emu asm compiler cc net web/pipeline/wasm; do
            echo "::group::$d"
            (cd "$d" && go vet ./... && go test -count=1 ./...)
            echo "::endgroup::"
          done

      - name: zigos on QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-misc expect
          cd os && ./test.exp
